    You need webhook admin permission. Add only environment references here; use **{{label:webhooks_rotate_secret}}** to generate an encrypted secret. Never put a secret value in an import file.
- key: process:webhooks_subscription.bulkInsert;slot:help
  summary: Add multiple subscriptions from a file.
  content: |
    Upload your file, map its columns, and review the preview before running the import.

    You need webhook manage permission. Choose valid endpoints and available event types; your access to source records still applies.
- key: process:webhooks_subscription.bulkEdit;slot:help
  summary: Change selected subscriptions together.
  content: |
    Select the records you want to change, enter the new values, and review the preview before applying them.

    You need webhook manage permission. Choose valid endpoints and available event types; your access to source records still applies.
